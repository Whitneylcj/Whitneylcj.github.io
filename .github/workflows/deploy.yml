name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_VISITOR_API_BASE: ${{ vars.PUBLIC_VISITOR_API_BASE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up CAG build runtime
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      - name: Install and verify the standalone CAG experiment
        run: |
          npm install --global pnpm@11.25.0
          pnpm --dir apps/cag-explorable install --frozen-lockfile
          pnpm --dir apps/cag-explorable typecheck
          pnpm --dir apps/cag-explorable test

      - name: Install, build, and upload site
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
